<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lex AU Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!--
      Umami analytics. Website ID is per-environment via Vite: .env.production
      for the Netlify build, .env.development for `npm run dev`. src/lib/
      analytics.ts track() calls no-op until this script defines window.umami.
    -->
    <script defer src="https://umami-indol-one.vercel.app/script.js" data-website-id="%VITE_UMAMI_WEBSITE_ID%"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
